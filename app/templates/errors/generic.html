{% extends "base.html" %}
{% block title %}{{ error_title }} — Queue Management System{% endblock %}

{% block extra_css %}
<style>
    .error-page { text-align: center; padding: 80px 20px; }
    .error-page .error-code { font-size: 5rem; margin: 0; color: #4f46e5; font-weight: 700; }
    .error-page h2 { margin: 10px 0 20px; }
    .error-page p { color: #666; margin-bottom: 24px; max-width: 480px; margin-left: auto; margin-right: auto; }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <p class="error-code">{{ error_code }}</p>
    <h2>{{ error_title }}</h2>
    <p>{{ error_message }}</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary">Back to Home</a>
</div>
{% endblock %}
